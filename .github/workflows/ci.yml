name: CI

on:
    # No paths-ignore: Test and Build + Lint run on every PR so they can be
    # required status checks without deadlocking docs-only / markdown-only PRs
    # (a required check that never runs stays pending forever and blocks merge).
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js 24
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  check-latest: true
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run tests
              run: pnpm run test

    build-lint:
        name: Build + Lint
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js 24
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  check-latest: true
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Typecheck (plugin and tests) and build
              run: pnpm run build
            - name: Lint
              run: pnpm run lint

    e2e:
        name: E2E (Obsidian)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Pinned like a dependency: bump deliberately, at least seven days after release.
            OBSIDIAN_VERSION: 1.14.4
            OBSIDIAN_SHA256: e70b7cd63787e7f798a84fec453f5c446b91877bd3f612e8fb98e9b76cc81120
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js 24
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  check-latest: true
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Install Xvfb
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
            - name: Install Obsidian
              run: |
                  archive="$RUNNER_TEMP/obsidian.tar.gz"
                  curl -fsSL -o "$archive" "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/obsidian-${OBSIDIAN_VERSION}.tar.gz"
                  echo "${OBSIDIAN_SHA256}  $archive" | sha256sum -c -
                  tar -xzf "$archive" -C "$RUNNER_TEMP"
                  echo "OBSIDIAN_DIR=$RUNNER_TEMP/obsidian-${OBSIDIAN_VERSION}" >> "$GITHUB_ENV"
            - name: Build
              run: pnpm run build
            - name: Start Obsidian
              run: |
                  pnpm run --silent start:e2e-obsidian -- \
                      --obsidian-app "$OBSIDIAN_DIR/obsidian" \
                      --obsidian-bin "$OBSIDIAN_DIR/obsidian-cli" \
                      --print-env > "$RUNNER_TEMP/e2e-env.sh"
                  sed -n "s/^export \([A-Z0-9_]*\)='\(.*\)'$/\1=\2/p" "$RUNNER_TEMP/e2e-env.sh" >> "$GITHUB_ENV"
            - name: Run E2E suite
              # The instance's CLI socket lives under its private HOME.
              run: HOME="$OBSIDIAN_E2E_OBSIDIAN_HOME" ./node_modules/.bin/vitest run --config vitest.e2e.config.mts
            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-failure-artifacts
                  path: |
                      .obsidian-e2e-artifacts/
                      /tmp/metaedit-obsidian-e2e/*/obsidian.log
                  if-no-files-found: ignore
            - name: Stop Obsidian
              if: always()
              run: pnpm run --silent stop:e2e-obsidian

name: Dependency Review

# Reviews dependency changes on every PR and blocks newly-introduced advisories
# before they land. No paths-ignore, so lockfile bumps are always scanned.
on:
    pull_request:
        branches: [master]

concurrency:
    group: dep-review-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Dependency Review
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  comment-summary-in-pr: on-failure
                  # Block newly-introduced moderate+ advisories in both runtime
                  # AND development scopes (the default only fails on runtime/high).
                  fail-on-severity: moderate
                  fail-on-scopes: runtime, development
